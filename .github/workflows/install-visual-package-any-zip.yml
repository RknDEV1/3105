name: Install visual rebrand package

on:
  workflow_dispatch:
    inputs:
      package_url:
        description: "URL direta do pacote ZIP de revisão"
        required: false
        type: string
        default: "https://www.dropbox.com/scl/fi/83wce3ptzugv2qpi8afnw/3105_chz_priv_review_package.zip?rlkey=nwv4qkqiagdyt4mzepxgyg8if&st=h5k3bjrj&dl=1"

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and validate review package
        id: package
        shell: bash
        env:
          PACKAGE_URL: ${{ inputs.package_url }}
        run: |
          set -euo pipefail

          WORK_DIR="$RUNNER_TEMP/visual-package"
          ZIP_FILE="$RUNNER_TEMP/3105-review-package.zip"
          rm -rf "$WORK_DIR" "$ZIP_FILE"
          mkdir -p "$WORK_DIR"

          echo "Downloading review package..."
          curl --location --fail --show-error --silent --retry 3 \
            "$PACKAGE_URL" \
            --output "$ZIP_FILE"

          test -s "$ZIP_FILE"
          unzip -t "$ZIP_FILE" >/dev/null
          unzip -q "$ZIP_FILE" -d "$WORK_DIR"

          PROJECT_FILE="$(find "$WORK_DIR" -type f -path '*/ThreeOneOSFive.xcodeproj/project.pbxproj' -print -quit)"
          if [ -z "$PROJECT_FILE" ]; then
            echo "ThreeOneOSFive.xcodeproj não foi encontrado no pacote." >&2
            echo "Conteúdo extraído:" >&2
            find "$WORK_DIR" -maxdepth 4 -print >&2
            exit 1
          fi

          SOURCE_ROOT="$(dirname "$(dirname "$PROJECT_FILE")")"
          echo "source_root=$SOURCE_ROOT" >> "$GITHUB_OUTPUT"
          echo "Projeto encontrado em: $SOURCE_ROOT"

      - name: Install project from review package
        shell: bash
        env:
          SOURCE_ROOT: ${{ steps.package.outputs.source_root }}
        run: |
          set -euo pipefail

          test -f "$SOURCE_ROOT/ThreeOneOSFive.xcodeproj/project.pbxproj"
          # O pacote contém uma cópia própria de .github. Ela não deve
          # sobrescrever os workflows do repositório.
          shopt -s dotglob nullglob
          for item in "$SOURCE_ROOT"/*; do
            name="$(basename "$item")"
            if [ "$name" = ".github" ]; then
              continue
            fi
            cp -R "$item" "$GITHUB_WORKSPACE/"
          done

          test -f "$GITHUB_WORKSPACE/ThreeOneOSFive.xcodeproj/project.pbxproj"

          PATCH_DIR="$GITHUB_WORKSPACE/ThreeOneOSFive/FreeFirePatches"
          mapfile -t PATCH_FILES < <(
            find "$PATCH_DIR" -maxdepth 1 -type f -name '*.3105' -printf '%f\n' | sort
          )
          test "${#PATCH_FILES[@]}" -gt 0

          # O manifesto antigo listava P01.bin–P13.bin, que não existem
          # neste pacote. Gere um inventário determinístico dos .3105 reais.
          {
            echo '['
            last_index=$((${#PATCH_FILES[@]} - 1))
            for index in "${!PATCH_FILES[@]}"; do
              filename="${PATCH_FILES[$index]}"
              digest="$(sha256sum "$PATCH_DIR/$filename" | awk '{print $1}')"
              comma=','
              if [ "$index" -eq "$last_index" ]; then comma=''; fi
              printf '  {"id": %d, "file": "%s", "sha256": "%s"}%s\n' \\
                "$((index + 1))" "$filename" "$digest" "$comma"
            done
            echo ']'
          } > "$PATCH_DIR/manifest.json"

          test "$(grep -c '"sha256"' "$PATCH_DIR/manifest.json")" -eq "${#PATCH_FILES[@]}"

          # Falhar antes do commit se algum workflow tiver sido alterado.
          if ! git diff --quiet -- .github; then
            echo "O pacote tentou alterar .github; abortando por segurança." >&2
            git diff -- .github >&2
            exit 1
          fi

      - name: Commit installed project
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Apply CHZ PRIV review package"
          git push
