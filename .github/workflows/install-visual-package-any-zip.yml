name: Install visual rebrand package

on:
  workflow_dispatch:
    inputs:
      package_url:
        description: "URL direta do pacote ZIP de revisão"
        required: false
        type: string
        default: "https://www.dropbox.com/scl/fi/0fru3mxmps2ysg7j2wds0/Patches.zip?rlkey=uexwyid477cnk9hl87ptog5xv&st=qjns13ad&dl=1"

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and validate review package
        id: package
        shell: bash
        env:
          PACKAGE_URL: ${{ inputs.package_url }}
        run: |
          set -euo pipefail

          WORK_DIR="$RUNNER_TEMP/visual-package"
          ZIP_FILE="$RUNNER_TEMP/3105-review-package.zip"
          rm -rf "$WORK_DIR" "$ZIP_FILE"
          mkdir -p "$WORK_DIR"

          echo "Downloading review package..."
          curl --location --fail --show-error --silent --retry 3 \
            "$PACKAGE_URL" \
            --output "$ZIP_FILE"

          test -s "$ZIP_FILE"
          unzip -t "$ZIP_FILE" >/dev/null
          unzip -q "$ZIP_FILE" -d "$WORK_DIR"

          PATCH_SOURCE="$(find "$WORK_DIR" -type d -name 'Patches' -print -quit)"
          if [ -z "$PATCH_SOURCE" ]; then
            PATCH_SOURCE="$WORK_DIR"
          fi
          test -n "$(find "$PATCH_SOURCE" -type f -name '*.3105' -print -quit)"
          echo "patch_source=$PATCH_SOURCE" >> "$GITHUB_OUTPUT"
          echo "Patches encontrados em: $PATCH_SOURCE"

      - name: Install project from review package
        shell: bash
        env:
          PATCH_SOURCE: ${{ steps.package.outputs.patch_source }}
        run: |
          set -euo pipefail

          # O pacote fornece somente recursos .3105. O código Swift, o projeto
          # Xcode e os workflows do repositório são a fonte de verdade.
          PATCH_DIR="$GITHUB_WORKSPACE/ThreeOneOSFive/FreeFirePatches"
          rm -rf "$PATCH_DIR"
          mkdir -p "$PATCH_DIR"
          while IFS= read -r -d '' source_file; do
            relative_path="${source_file#"$PATCH_SOURCE"/}"
            destination="$PATCH_DIR/$relative_path"
            mkdir -p "$(dirname "$destination")"
            cp -f "$source_file" "$destination"
          done < <(find "$PATCH_SOURCE" -type f -name '*.3105' -print0)
          test -f "$GITHUB_WORKSPACE/ThreeOneOSFive.xcodeproj/project.pbxproj"

          mapfile -t PATCH_FILES < <(
            find "$PATCH_DIR" -type f -name '*.3105' -printf '%P\n' | sort
          )
          test "${#PATCH_FILES[@]}" -gt 0

          # O manifesto antigo listava P01.bin–P13.bin, que não existem
          # neste pacote. Gere um inventário determinístico dos .3105 reais.
          {
            echo '['
            last_index=$((${#PATCH_FILES[@]} - 1))
            for index in "${!PATCH_FILES[@]}"; do
              relative_path="${PATCH_FILES[$index]}"
              filename="$(basename "$relative_path")"
              category="$(dirname "$relative_path")"
              digest="$(sha256sum "$PATCH_DIR/$relative_path" | awk '{print $1}')"
              comma=','
              if [ "$index" -eq "$last_index" ]; then comma=''; fi
              printf '  {"id": %d, "category": "%s", "file": "%s", "path": "%s", "sha256": "%s"}%s\n' "$((index + 1))" "$category" "$filename" "$relative_path" "$digest" "$comma"
            done
            echo ']'
          } > "$PATCH_DIR/manifest.json"

          test "$(grep -c '"sha256"' "$PATCH_DIR/manifest.json")" -eq "${#PATCH_FILES[@]}"
          test "$(grep -c '"category"' "$PATCH_DIR/manifest.json")" -eq "${#PATCH_FILES[@]}"

          # Falhar antes do commit se algum workflow tiver sido alterado.
          if ! git diff --quiet -- .github; then
            echo "O pacote tentou alterar .github; abortando por segurança." >&2
            git diff -- .github >&2
            exit 1
          fi

      - name: Commit installed project
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Apply CHZ PRIV review package"
          git push
