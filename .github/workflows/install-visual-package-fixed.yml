name: Install visual rebrand package

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract and install modified project
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE="3105_v1.1.1_identidade_vermelha.zip"
          test -f "$PACKAGE"
          WORK_DIR="$RUNNER_TEMP/visual-package"
          rm -rf "$WORK_DIR"
          mkdir -p "$WORK_DIR"
          unzip -q "$PACKAGE" -d "$WORK_DIR"
          SOURCE="$WORK_DIR/repo_v1.1.1"
          test -d "$SOURCE"
          cp -R "$SOURCE"/. .
          rm -f "$PACKAGE"
          rm -rf "$WORK_DIR"

      - name: Commit installed project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Apply CHZ PRIV red visual identity to v1.1.1"
          git push
